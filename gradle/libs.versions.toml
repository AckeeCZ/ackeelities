[versions]
agp = "9.3.1"
android-activity = "1.13.0"
android-core = "1.19.0"
android-lifecycle = "2.11.0"
compose-bom = "2026.08.00"
detekt = "1.23.8"
dokka = "2.2.0"
gradle-testLogger = "4.0.0"
gradle-versions = "0.61.0"
junit5-bom = "6.1.3"
kotlin = "2.4.10"
kotlin-coroutinesBom = "1.11.0"
kotest = "6.2.4"
mavenPublish = "0.37.0"

[libraries]
android-activity = { module = "androidx.activity:activity", version.ref = "android-activity" }
android-core = { module = "androidx.core:core", version.ref = "android-core" }
android-lifecycle-runtimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "android-lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "android-activity" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-uiTooling = { module = "androidx.compose.ui:ui-tooling" }
compose-uiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }

coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "kotlin-coroutinesBom" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }

detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }

junit5-bom = { module = "org.junit:junit-bom", version.ref = "junit5-bom" }

kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotest-runner-junit6 = { module = "io.kotest:kotest-runner-junit6", version.ref = "kotest" }

# Build-logic dependencies
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
gradleVersions-gradlePlugin = { module = "io.github.ben-manes:gradle-versions-plugin", version.ref = "gradle-versions" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
mavenPublish-gradlePlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "mavenPublish" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
gradle-testLogger = { id = "com.adarshr.test-logger", version.ref = "gradle-testLogger" }
gradle-versions = { id = "io.github.ben-manes.versions", version.ref = "gradle-versions" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }

# Convention plugins defined by this project
ackeecz-ackeelities-android-application = { id = "ackeecz.ackeelities.android.application" }
ackeecz-ackeelities-dependency-updates = { id = "ackeecz.ackeelities.dependency.updates" }
ackeecz-ackeelities-kmp-library = { id = "ackeecz.ackeelities.kmp.library" }
ackeecz-ackeelities-kmp-testing = { id = "ackeecz.ackeelities.kmp.testing" }
ackeecz-ackeelities-preflightchecks = { id = "ackeecz.ackeelities.preflightchecks" }
ackeecz-ackeelities-publishing = { id = "ackeecz.ackeelities.publishing" }
